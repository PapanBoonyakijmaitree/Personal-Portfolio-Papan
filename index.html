<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Papan Boonyakijmaitree</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='white'/%3E%3Ctext x='10' y='67' font-family='Georgia, Times New Roman, serif' font-weight='900' font-size='48' fill='%23111827' letter-spacing='-1'%3EPB%3C/text%3E%3Ccircle cx='78' cy='63' r='7.5' fill='%23F97316'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              accent: '#F97316',
              'accent-light': '#FB923C',
            },
            fontFamily: {
              display: ['"DM Serif Display"', 'serif'],
              body:    ['"DM Sans"', 'sans-serif'],
            },
            keyframes: {
              fadeUp: {
                '0%':   { opacity: '0', transform: 'translateY(30px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%':      { opacity: '0' },
              },
            },
            animation: {
              fadeUp: 'fadeUp 0.7s ease forwards',
              blink:  'blink 1s step-end infinite',
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
